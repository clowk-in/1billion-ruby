name: CI

# The tests of the gem on each pull request and each push to main. When the
# tests pass on a release commit (the commit "release: X.Y.Z" that make tag
# pushes with its tag vX.Y.Z), the last jobs make the GitHub release
# (release.yml) and push the gem to rubygems.org (publish.yml). So a release
# is tested once, and a red CI publishes nothing.

on:
  pull_request:
  push:
    branches: [main]

# A release commit has a group of its own, so no push cancels it.
concurrency:
  group: "${{ startsWith(github.event.head_commit.message, 'release: ') && format('ci-release-{0}', github.sha) || format('ci-{0}', github.ref) }}"
  cancel-in-progress: "${{ !startsWith(github.event.head_commit.message, 'release: ') }}"

permissions:
  contents: read

jobs:
  ruby:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Tests
        run: bundle exec rake

      - name: Build the gem
        run: gem build 1billion.gemspec

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck scripts/*.sh

  # The release tag of this commit, when it has one.
  tag:
    needs: [ruby, shellcheck]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Find the tag of this commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/v" --paginate --jq '.[] | select(.object.sha == "${{ github.sha }}") | .ref' | sed 's#^refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: [tag]
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write

  publish:
    needs: [tag]
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit
