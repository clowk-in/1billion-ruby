name: publish

# The gem 1billion of a release, on rubygems.org. There are no tests here:
# CI calls this workflow only after its tests passed on the release commit.
#
# It pushes with the secret GEM_HOST_API_KEY when the repo has it, and with
# trusted publishing (OIDC) when it does not.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

  # Run by hand: the tag must exist.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag (vX.Y.Z)
        type: string
        required: true

env:
  TAG: ${{ inputs.tag }}

permissions:
  contents: read
  id-token: write

# One release at a time, never cancelled halfway (a gem version can be
# pushed only once).
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  gem:
    name: gem (1billion)
    runs-on: ubuntu-latest

    env:
      GEM_HOST_API_KEY: ${{ secrets.GEM_HOST_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Check the version matches the tag
        run: test "v$(ruby -Ilib -ronebillion/version -e 'puts OneBillion::VERSION')" = "$TAG"

      - name: Build
        run: gem build 1billion.gemspec

      # Trusted publishing: the OIDC token of this job becomes a push key of
      # 15 minutes. A new gem must name its owner (the rubygems.org account
      # 103733) in the exchange, and rubygems/configure-rubygems-credentials
      # has no input for it yet, so this step does the same exchange itself.
      - name: Get a push key (trusted publishing)
        if: ${{ env.GEM_HOST_API_KEY == '' }}
        env:
          RUBYGEMS_OWNER: "103733"
        run: |
          jwt="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)"

          body="$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER" '{jwt: $jwt, owner: $owner}')"

          answer="$(curl -sS -w '\n%{http_code}' -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token -H "Content-Type: application/json" -d "$body")"
          status="$(echo "$answer" | tail -n 1)"
          key="$(echo "$answer" | sed '$d' | jq -r '.rubygems_api_key // empty')"

          if [ "$status" != "201" ] || [ -z "$key" ]; then
            echo "the exchange failed with $status: $(echo "$answer" | sed '$d' | jq -c '.errors // .' 2>/dev/null)"

            exit 1
          fi

          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"

      # A version that is already on rubygems.org is skipped, so a re-run
      # finishes a release that stopped halfway.
      - name: Push
        shell: bash
        run: gem push 1billion-*.gem 2>&1 | tee push.log || grep -q "Repushing of gem versions is not allowed" push.log
